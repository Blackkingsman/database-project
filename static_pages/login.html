<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="../dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../custom-css/stylesheet.css">
    <!-- Title of the website -->
    <title>Project Part 1</title>
</head>
<!--This is just showing how to use branches-->
<body>
    <!--Homepage banner-->
    <div class="jumbotron jumbotron-fluid sticky-top" id="homepage-jumbotron">
        <h1 class="text-white text-center col-md-12">Welcome to Database Project</h1>

    </div>
    <!--Making some changes in the master branch-->
    <!--Contains the body of most the object in the website-->
    <div class="container rounded text-dark" id="homepage_content-container">
        <div class="container d-flex justify-content-center">
            <div class="row py-1">
                <h2 class="text-center text-dark">Login Form</h2>
            </div>
        </div>
        <!--Contains the form for signing in-->
        <div class="container my-2 font-weight-bold">
            <form class="justify-content-center" name="login" method="POST" action="../php_pages/login_action.php">
                <div class="form-row justify-content-center">
                    <div class="form-group col-md-10">
                        <label for="clientid">Email:</label>
                        <input type="text" class="form-control" id="clientid" name="clientid"
                            placeholder="Enter your email here.">
                    </div>
                    <div class="form-group col-md-10">
                        <label for="password">Password:</label>
                        <input type="text" class="form-control" id="password" name="password"
                            placeholder="Enter your password here.">
                    </div>
                    <div class="form-group col-md-10">
                        <label for="clientType">Student/Admin/Both</label>
                        <select name="clientType" id="clientType" class="form-control">
                            <option selected value="studentType">Student</option>
                            <option value="administratorType">Admin</option>
                            <option value="bothType">Both</option>
                        </select>
                    </div>
                    <div class="form-group col-md-10">
                        <button type="submit" id="Homepage_login_button" class="btn btn-primary btn-lg btn-block">Log
                            In</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
